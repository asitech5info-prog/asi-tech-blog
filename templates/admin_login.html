<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Suite Portal | ASI TECH</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-login-wrapper">
        <div class="admin-login-card-modern">
            <div class="admin-auth-header">
                <div class="admin-shield-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1 style="font-size:1.6rem; color:#ffffff; margin-bottom:4px;">ASI TECH PORTAL</h1>
                <p style="color:var(--text-muted); font-size:0.85rem; font-family:var(--font-mono);">RESTRICTED ACCESS LEVEL 1</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div style="margin-bottom:20px;">
                        {% for category, message in messages %}
                            <div class="flash flash-{{ category }}" style="position:static; margin-bottom:10px;">
                                <i class="fas fa-exclamation-circle"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('admin_auth') }}" method="post">
                <div class="input-field-group" style="margin-bottom:24px;">
                    <label><i class="fas fa-key" style="color:var(--accent-emerald);"></i> Master Security Key</label>
                    <div style="position:relative;">
                        <input type="password" id="adminPwdInput" name="password" placeholder="Enter administrative password..." required autofocus style="width:100%; padding-right:45px;">
                        <button type="button" onclick="togglePasswordVisibility()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1rem;">
                            <i class="fas fa-eye" id="pwdEyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary-action" style="width:100%; justify-content:center; padding:14px; font-size:1rem;">
                    <i class="fas fa-unlock-keyhole"></i> Authorize &amp; Enter
                </button>
            </form>

            <div style="text-align:center; margin-top:24px;">
                <a href="{{ url_for('home') }}" style="color:var(--text-muted); font-size:0.88rem; display:inline-flex; align-items:center; gap:8px;">
                    <i class="fas fa-arrow-left"></i> Return to Public Site
                </a>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('adminPwdInput');
            const icon = document.getElementById('pwdEyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
