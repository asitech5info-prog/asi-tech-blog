{% extends "base.html" %}

{% block title %}Contact Us | ASI TECH{% endblock %}

{% block content %}
<section class="contact-page">
    <div class="container">
        <div class="contact-header">
            <h1><i class="fas fa-envelope"></i> Contact Us</h1>
            <p>Have a question or want to collaborate? Reach out to us!</p>
        </div>

        <div class="contact-layout">
            <div class="contact-form-section">
                <form action="{{ url_for('contact') }}" method="post" class="contact-form">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Your Name *</label>
                        <input type="text" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Your Email *</label>
                        <input type="email" name="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-heading"></i> Subject</label>
                        <input type="text" name="subject" placeholder="What's this about?">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-comment-dots"></i> Message *</label>
                        <textarea name="message" rows="6" placeholder="Write your message here..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-paper-plane"></i> Send Message
                    </button>
                </form>
            </div>

            <div class="contact-info-section">
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <h3>Email Us</h3>
                    <a href="mailto:asitech5info@gmail.com">asitech5info@gmail.com</a>
                </div>

                <div class="contact-card">
                    <div class="contact-icon youtube-icon">
                        <i class="fab fa-youtube"></i>
                    </div>
                    <h3>YouTube Channel</h3>
                    <a href="https://youtube.com/@howtech_works?si=gXvodLAXQ36FVHMZ" target="_blank">HOW TECH WORKS</a>
                </div>

                <div class="contact-card yt-promo-card">
                    <a href="https://youtube.com/@howtech_works?si=gXvodLAXQ36FVHMZ" target="_blank" class="yt-big-btn">
                        <i class="fab fa-youtube"></i>
                        <div>
                            <span class="yt-label">Visit Our Channel</span>
                            <span class="yt-name">HOW TECH WORKS</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
