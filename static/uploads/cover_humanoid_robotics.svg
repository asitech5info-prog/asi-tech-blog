<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgRobot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0814" />
      <stop offset="50%" stop-color="#140f26" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowRobot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgRobot)" />

  <!-- Grid -->
  <g stroke="rgba(245,158,11,0.05)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right Visual: Humanoid Robotic Bipedal & Actuator Schematic -->
  <g transform="translate(700, 100)">
    <circle cx="210" cy="200" r="180" fill="#ef4444" opacity="0.1" filter="url(#glowRobot)" />

    <!-- Robot Head Visor -->
    <rect x="150" y="20" width="120" height="80" rx="20" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2" />
    <line x1="170" y1="60" x2="250" y2="60" stroke="#ef4444" stroke-width="4" filter="url(#glowRobot)" />
    <text x="210" y="85" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">SLAM VISUAL OCCUPANCY</text>

    <!-- Torso / Central Computer -->
    <rect x="110" y="115" width="200" height="150" rx="20" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="210" y="165" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">EMBODIED AI CORE</text>
    <text x="210" y="190" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">End-to-End Neural VLA</text>
    <text x="210" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">28 Structural Actuator DOF</text>
    <text x="210" y="240" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">11-DOF Tactile Fingertips</text>

    <!-- Left / Right Actuator Arms -->
    <path d="M 110 140 L 40 220 L 50 320" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="40" cy="220" r="12" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2" />
    
    <path d="M 310 140 L 380 220 L 370 320" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="380" cy="220" r="12" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2" />

    <!-- Bottom Metrics -->
    <rect x="60" y="340" width="300" height="50" rx="14" fill="rgba(15,23,42,0.85)" stroke="#ef4444" stroke-width="1.2" />
    <text x="210" y="370" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">⚡ TESLA OPTIMUS • BOSTON DYNAMICS ATLAS</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="38" rx="19" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="115" y="24" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">EMBODIED ROBOTICS</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Humanoid Robotics &amp;</text>
    <text x="0" y="150" fill="url(#robotGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Embodied AI Revolution</text>
    
    <!-- Description -->
    <text x="0" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Tesla Optimus Gen 2, Boston Dynamics Atlas &amp; Vision-Language-Action models.</text>

    <!-- Metadata -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">● ROBOTICS &amp; AI</text>
      <text x="180" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  5 min read</text>
      <text x="290" y="0" fill="#ec4899" font-family="'Inter', sans-serif" font-size="14">|  EMBODIED TECH</text>
    </g>
  </g>
</svg>
