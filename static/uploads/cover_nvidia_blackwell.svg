<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgNvidia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020a04" />
      <stop offset="50%" stop-color="#05140a" />
      <stop offset="100%" stop-color="#010502" />
    </linearGradient>
    <linearGradient id="nvidiaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76b900" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glowNvidia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgNvidia)" />

  <!-- Grid Matrix -->
  <g stroke="rgba(118,185,0,0.06)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right Visual: Dual-Die Blackwell GPU & NVLink Bus -->
  <g transform="translate(680, 100)">
    <circle cx="210" cy="210" r="180" fill="#76b900" opacity="0.1" filter="url(#glowNvidia)" />

    <!-- Dual-Die Package Outer -->
    <rect x="30" y="20" width="360" height="380" rx="24" fill="#0b1a0e" stroke="#76b900" stroke-width="2" />

    <!-- Die 1 (Left) -->
    <rect x="55" y="45" width="145" height="230" rx="14" fill="#132a18" stroke="#a3e635" stroke-width="1.5" />
    <text x="127" y="140" fill="#76b900" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">DIE 0</text>
    <text x="127" y="165" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">104B Transistors</text>
    <text x="127" y="185" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">TSMC 4NP 2nd-Gen</text>

    <!-- NVLink 10 TB/s Bridge Center -->
    <rect x="195" y="100" width="30" height="120" rx="6" fill="#76b900" filter="url(#glowNvidia)" />
    <text x="210" y="165" fill="#05140a" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle" transform="rotate(-90, 210, 165)">10 TB/s NVLink-C2C</text>

    <!-- Die 2 (Right) -->
    <rect x="220" y="45" width="145" height="230" rx="14" fill="#132a18" stroke="#a3e635" stroke-width="1.5" />
    <text x="292" y="140" fill="#76b900" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">DIE 1</text>
    <text x="292" y="165" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">104B Transistors</text>
    <text x="292" y="185" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">FP4 Tensor Core</text>

    <!-- HBM3e Memory Banks Bottom -->
    <rect x="55" y="295" width="310" height="85" rx="14" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" />
    <text x="210" y="330" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">192 GB HBM3e @ 8.0 TB/s</text>
    <text x="210" y="355" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Liquid Cooled Direct-to-Chip CDU</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="240" height="38" rx="19" fill="rgba(118, 185, 0, 0.12)" stroke="#76b900" stroke-width="1.5" />
    <text x="120" y="24" fill="#a3e635" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">NVIDIA AI ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">NVIDIA Blackwell GB200</text>
    <text x="0" y="150" fill="url(#nvidiaGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">&amp; Exascale Supercomputing</text>
    
    <!-- Description -->
    <text x="0" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">208B transistors, 10 TB/s NVLink 5, FP4 inference &amp; NVL72 liquid cooling.</text>

    <!-- Metadata -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#76b900" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">● NVIDIA &amp; SILICON</text>
      <text x="200" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  6 min read</text>
      <text x="310" y="0" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="14">|  SUPERCOMPUTING</text>
    </g>
  </g>
</svg>
