<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgPqc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a24" />
      <stop offset="50%" stop-color="#06364a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="pqcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="pqcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgPqc)" />

  <g transform="translate(680, 140)">
    <circle cx="200" cy="180" r="150" fill="#06b6d4" opacity="0.12" filter="url(#pqcGlow)" />
    
    <!-- Shield / Lattice Key -->
    <path d="M 200 60 L 320 110 L 320 220 Q 200 310 200 310 Q 80 220 80 110 Z" fill="rgba(15, 23, 42, 0.85)" stroke="#06b6d4" stroke-width="2.5" />
    <circle cx="200" cy="170" r="28" fill="#06b6d4" opacity="0.25" filter="url(#pqcGlow)" />
    <circle cx="200" cy="170" r="14" fill="#38bdf8" />

    <text x="200" y="240" fill="#a5f3fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">ML-KEM / CRYSTALS-KYBER</text>
  </g>

  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="220" height="40" rx="20" fill="rgba(6, 182, 212, 0.18)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="110" y="25" fill="#67e8f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">CRYPTOGRAPHY &amp; SECURITY</text>

    <text x="0" y="105" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">Post-Quantum</text>
    <text x="0" y="160" fill="url(#pqcGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">Lattice Cryptography</text>
    
    <text x="0" y="225" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">NIST standards securing the internet from quantum decryption.</text>

    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="14">● CYBERSECURITY</text>
      <text x="170" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  5 min read</text>
    </g>
  </g>
</svg>
