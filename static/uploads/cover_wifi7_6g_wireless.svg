<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgWifi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b14" />
      <stop offset="50%" stop-color="#09182b" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>
    <linearGradient id="wifiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2dd4bf" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowWifi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgWifi)" />

  <!-- Waveform grid -->
  <g stroke="rgba(56,189,248,0.05)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right Visual: Wi-Fi 7 Multi-Link RF Waves & 4096-QAM Constellation -->
  <g transform="translate(680, 100)">
    <circle cx="210" cy="200" r="180" fill="#38bdf8" opacity="0.1" filter="url(#glowWifi)" />

    <!-- Concentric RF Antenna Waves -->
    <path d="M 90 280 A 150 150 0 0 1 330 280" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="6 4" />
    <path d="M 120 280 A 110 110 0 0 1 300 280" stroke="#2dd4bf" stroke-width="4" fill="none" opacity="0.7" />
    <path d="M 150 280 A 70 70 0 0 1 270 280" stroke="#818cf8" stroke-width="5" fill="none" filter="url(#glowWifi)" />
    <circle cx="210" cy="280" r="12" fill="#38bdf8" filter="url(#glowWifi)" />

    <!-- 3 Band MLO Channels Box -->
    <rect x="40" y="30" width="340" height="130" rx="16" fill="rgba(15,23,42,0.9)" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="210" y="60" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">MULTI-LINK OPERATION (MLO)</text>
    
    <g transform="translate(60, 80)">
      <rect x="0" y="0" width="90" height="55" rx="8" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1" />
      <text x="45" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">2.4 GHz</text>
      <text x="45" y="44" fill="#bae6fd" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Range Band</text>

      <rect x="105" y="0" width="90" height="55" rx="8" fill="rgba(45,212,191,0.15)" stroke="#2dd4bf" stroke-width="1" />
      <text x="150" y="24" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">5.0 GHz</text>
      <text x="150" y="44" fill="#99f6e4" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Throughput</text>

      <rect x="210" y="0" width="90" height="55" rx="8" fill="rgba(192,132,252,0.15)" stroke="#c084fc" stroke-width="1" />
      <text x="255" y="24" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">6.0 GHz</text>
      <text x="255" y="44" fill="#f5d0fe" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">320MHz Ultra</text>
    </g>

    <!-- Bottom Specs -->
    <rect x="50" y="325" width="320" height="50" rx="14" fill="rgba(15,23,42,0.9)" stroke="#818cf8" stroke-width="1.2" />
    <text x="210" y="355" fill="#e0e7ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">🚀 46 Gbps SPEED • &lt; 1ms WIRELESS LATENCY</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="24" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">WIRELESS PROTOCOLS</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Wi-Fi 7 &amp; 6G Terahertz</text>
    <text x="0" y="150" fill="url(#wifiGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Wireless Speed Frontier</text>
    
    <!-- Description -->
    <text x="0" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">320 MHz channels, 4096-QAM modulation &amp; Multi-Link Operation.</text>

    <!-- Metadata -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">● WIRELESS &amp; 6G</text>
      <text x="190" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  4 min read</text>
      <text x="300" y="0" fill="#2dd4bf" font-family="'Inter', sans-serif" font-size="14">|  NEXT-GEN TECH</text>
    </g>
  </g>
</svg>
