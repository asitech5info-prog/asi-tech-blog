<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgR1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="r1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="r1glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgR1)" />

  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Neural Reasoning Graph Graphic -->
  <g transform="translate(680, 130)">
    <circle cx="220" cy="180" r="160" fill="#6366f1" opacity="0.14" filter="url(#r1glow)" />
    
    <!-- Chain of thought path -->
    <path d="M 60 280 L 140 180 L 260 220 L 360 100" stroke="#38bdf8" stroke-width="3" fill="none" stroke-dasharray="6 4" />
    
    <circle cx="60" cy="280" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
    <text x="60" y="285" fill="#bae6fd" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Input</text>

    <circle cx="140" cy="180" r="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" />
    <text x="140" y="185" fill="#e0e7ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">RL CoT</text>

    <circle cx="260" cy="220" r="24" fill="#311042" stroke="#c084fc" stroke-width="2.5" />
    <text x="260" y="225" fill="#f5d0fe" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Verify</text>

    <circle cx="360" cy="100" r="28" fill="#064e3b" stroke="#34d399" stroke-width="3" filter="url(#r1glow)" />
    <text x="360" y="105" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Result</text>
  </g>

  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="220" height="40" rx="20" fill="rgba(99, 102, 241, 0.18)" stroke="#6366f1" stroke-width="1.5" />
    <text x="110" y="25" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">REASONING AI LABS</text>

    <text x="0" y="105" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">DeepSeek-R1 &amp;</text>
    <text x="0" y="160" fill="url(#r1Grad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">Reasoning LLMs</text>
    
    <text x="0" y="225" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Reinforcement learning and test-time compute breakthrough.</text>

    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14">● FRONTIER AI</text>
      <text x="140" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  5 min read</text>
    </g>
  </g>
</svg>
