<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgSamsung" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#02050c" />
    </linearGradient>
    <linearGradient id="galaxyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowGalaxy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgSamsung)" />

  <!-- Geometric Grid Matrix -->
  <g stroke="rgba(56,189,248,0.04)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right Visual: Galaxy S25 Ultra Phone Outline & Galaxy AI Star Array -->
  <g transform="translate(690, 100)">
    <!-- Ambient Glow -->
    <circle cx="210" cy="210" r="190" fill="#38bdf8" opacity="0.1" filter="url(#glowGalaxy)" />
    
    <!-- Phone Chassis Outline -->
    <rect x="50" y="20" width="320" height="380" rx="36" fill="url(#titaniumGrad)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Camera Island Rings -->
    <g transform="translate(80, 50)">
      <circle cx="35" cy="35" r="28" fill="#0f172a" stroke="#60a5fa" stroke-width="2" />
      <circle cx="35" cy="35" r="14" fill="#1e293b" />
      <circle cx="35" cy="35" r="6" fill="#38bdf8" filter="url(#glowGalaxy)" />
      
      <circle cx="35" cy="115" r="28" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
      <circle cx="35" cy="115" r="14" fill="#1e293b" />
      <circle cx="35" cy="115" r="6" fill="#c084fc" />

      <circle cx="35" cy="195" r="28" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
      <circle cx="35" cy="195" r="14" fill="#1e293b" />
      <circle cx="35" cy="195" r="6" fill="#f472b6" />
    </g>

    <!-- AI Neural Specs Block -->
    <g transform="translate(170, 70)">
      <!-- AI Chip Spec -->
      <rect x="0" y="0" width="170" height="65" rx="12" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="85" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">SNAPDRAGON 8 ELITE</text>
      <text x="85" y="48" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">4.32GHz Oryon CPU</text>

      <!-- Multimodal NPU Spec -->
      <rect x="0" y="80" width="170" height="65" rx="12" fill="rgba(168,85,247,0.1)" stroke="#a855f7" stroke-width="1.2" />
      <text x="85" y="106" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">GALAXY AI 2.0</text>
      <text x="85" y="128" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Cross-App Agentic NPU</text>

      <!-- Optics Spec -->
      <rect x="0" y="160" width="170" height="65" rx="12" fill="rgba(236,72,153,0.1)" stroke="#ec4899" stroke-width="1.2" />
      <text x="85" y="186" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">200MP ISOCELL</text>
      <text x="85" y="208" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">AI ProVisual Engine</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="75" y="330" width="270" height="40" rx="12" fill="rgba(15,23,42,0.8)" stroke="#475569" stroke-width="1" />
    <text x="210" y="355" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">⚡ KNOX MATRIX • DECENTRALIZED TRUST</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="rgba(96, 165, 250, 0.12)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="110" y="24" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">SAMSUNG &amp; ANDROID</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Galaxy S25 Ultra &amp;</text>
    <text x="0" y="150" fill="url(#galaxyGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Galaxy AI 2.0 Frontier</text>
    
    <!-- Description -->
    <text x="0" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Snapdragon 8 Elite, Multimodal AI Agents &amp; ProVisual 200MP sensor.</text>

    <!-- Metadata -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">● SAMSUNG GALAXY</text>
      <text x="200" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  5 min read</text>
      <text x="310" y="0" fill="#ec4899" font-family="'Inter', sans-serif" font-size="14">|  FLAGSHIP TECH</text>
    </g>
  </g>
</svg>
