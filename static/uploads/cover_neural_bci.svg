<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgBci" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1136" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="bciGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="bciGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgBci)" />

  <g transform="translate(680, 140)">
    <circle cx="200" cy="180" r="160" fill="#8b5cf6" opacity="0.14" filter="url(#bciGlow)" />
    
    <!-- Synaptic Waveform / Brain Mesh -->
    <path d="M 40 180 Q 90 90 140 180 T 240 180 T 340 180" stroke="#c084fc" stroke-width="3" fill="none" />
    <path d="M 40 210 Q 100 280 160 210 T 260 210 T 360 210" stroke="#f472b6" stroke-width="2" fill="none" stroke-dasharray="4 4" />

    <circle cx="140" cy="180" r="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="240" cy="180" r="20" fill="#1e1b4b" stroke="#ec4899" stroke-width="2.5" />
    <circle cx="340" cy="180" r="14" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />

    <text x="200" y="290" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">1024-CHANNEL NEURAL TELEMETRY</text>
  </g>

  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="220" height="40" rx="20" fill="rgba(139, 92, 246, 0.18)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="110" y="25" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">NEUROTECH &amp; BCI</text>

    <text x="0" y="105" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">Brain-Computer</text>
    <text x="0" y="160" fill="url(#bciGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">Neural Interfaces</text>
    
    <text x="0" y="225" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Human clinical trials and direct cortex-to-machine synthesis.</text>

    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="14">● BIO-ENGINEERING</text>
      <text x="170" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  5 min read</text>
    </g>
  </g>
</svg>
