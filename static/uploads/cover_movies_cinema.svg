<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f091c" />
      <stop offset="50%" stop-color="#2d0b28" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="movGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad5)" />

  <!-- Cinema Lens & Virtual Production Wall Art -->
  <g transform="translate(680, 150)">
    <circle cx="200" cy="180" r="150" fill="#ec4899" opacity="0.12" filter="url(#glow5)" />
    
    <!-- Virtual Production Frame -->
    <rect x="20" y="20" width="380" height="240" rx="14" fill="rgba(30, 10, 30, 0.7)" stroke="#ec4899" stroke-width="2" />
    <polygon points="170,100 250,140 170,180" fill="url(#movGrad)" />
    
    <!-- LED Grid lines -->
    <g stroke="rgba(236, 72, 153, 0.2)" stroke-width="1">
      <line x1="20" y1="80" x2="400" y2="80" />
      <line x1="20" y1="140" x2="400" y2="140" />
      <line x1="20" y1="200" x2="400" y2="200" />
      <line x1="100" y1="20" x2="100" y2="260" />
      <line x1="200" y1="20" x2="200" y2="260" />
      <line x1="300" y1="20" x2="300" y2="260" />
    </g>

    <rect x="50" y="280" width="320" height="32" rx="16" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1" />
    <text x="210" y="301" fill="#fda4af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">UNREAL ENGINE 5.5 IN-CAMERA VFX</text>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1.5" />
    <text x="80" y="25" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">MOVIES &amp; VFX</text>

    <text x="0" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Cinematic Evolution</text>
    <text x="0" y="170" fill="url(#movGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Virtual Production</text>
    
    <text x="0" y="235" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18">How LED volumes and Unreal Engine are transforming Hollywood.</text>

    <g transform="translate(0, 280)">
      <text x="0" y="0" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="14">● ASI TECH CINEMA INSIGHTS</text>
      <text x="240" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  5 min read</text>
    </g>
  </g>
</svg>
