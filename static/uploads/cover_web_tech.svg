<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="50%" stop-color="#0b1e36" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad2)" />

  <!-- Background Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <circle cx="880" cy="300" r="160" fill="#06b6d4" opacity="0.15" filter="url(#glow2)" />

  <!-- Futuristic Architecture Code Window -->
  <g transform="translate(680, 140)">
    <rect x="0" y="0" width="440" height="340" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
    <!-- Header -->
    <rect x="0" y="0" width="440" height="40" rx="16" fill="rgba(255,255,255,0.05)" />
    <circle cx="25" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="59" cy="20" r="5" fill="#10b981" />
    <text x="220" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">edge-architecture.ts</text>
    
    <!-- Code preview -->
    <g transform="translate(25, 70)" font-family="'JetBrains Mono', monospace" font-size="13">
      <text x="0" y="0" fill="#ec4899">export const</text>
      <text x="110" y="0" fill="#38bdf8">EdgeConfig</text>
      <text x="210" y="0" fill="#ffffff">=</text>
      <text x="230" y="0" fill="#fbbf24">{</text>
      
      <text x="20" y="30" fill="#a5b4fc">runtime:</text>
      <text x="100" y="30" fill="#34d399">'edge-v8'</text>
      <text x="175" y="30" fill="#94a3b8">,</text>

      <text x="20" y="60" fill="#a5b4fc">islands:</text>
      <text x="100" y="60" fill="#67e8f9">[ 'Search', 'Hero' ]</text>
      <text x="260" y="60" fill="#94a3b8">,</text>

      <text x="20" y="90" fill="#a5b4fc">caching:</text>
      <text x="100" y="90" fill="#34d399">'stale-while-revalidate'</text>

      <text x="0" y="130" fill="#fbbf24">}</text>

      <!-- Glow tag -->
      <rect x="0" y="160" width="390" height="40" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <text x="20" y="185" fill="#34d399" font-size="12">⚡ 0ms Global Edge Cold Start</text>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="90" y="25" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">TECHNOLOGY</text>

    <text x="0" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Next-Gen Web</text>
    <text x="0" y="170" fill="url(#techGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Edge &amp; Islands</text>
    
    <text x="0" y="235" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18">Unlocking instant performance with modern distributed SSR.</text>

    <g transform="translate(0, 280)">
      <text x="0" y="0" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="14">● ASI TECH ARCHITECTURE</text>
      <text x="220" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  4 min read</text>
    </g>
  </g>
</svg>
