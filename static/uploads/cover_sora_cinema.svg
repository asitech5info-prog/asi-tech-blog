<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgSora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180424" />
      <stop offset="50%" stop-color="#2d0b38" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="soraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="soraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgSora)" />

  <g transform="translate(680, 140)">
    <circle cx="200" cy="180" r="150" fill="#ec4899" opacity="0.14" filter="url(#soraGlow)" />
    
    <!-- Video Timeline Clapperboard -->
    <rect x="30" y="50" width="340" height="230" rx="14" fill="rgba(20, 10, 30, 0.85)" stroke="#ec4899" stroke-width="2" />
    <polygon points="170,120 240,165 170,210" fill="url(#soraGrad)" />
    
    <text x="200" y="95" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">SORA SPATIO-TEMPORAL PATCHES</text>
    <text x="200" y="255" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">DIFFUSION TRANSFORMER (DiT)</text>
  </g>

  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="220" height="40" rx="20" fill="rgba(236, 72, 153, 0.18)" stroke="#ec4899" stroke-width="1.5" />
    <text x="110" y="25" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">CINEMA AI &amp; VFX</text>

    <text x="0" y="105" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">Generative Video &amp;</text>
    <text x="0" y="160" fill="url(#soraGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">Diffusion in Cinema</text>
    
    <text x="0" y="225" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Sora, spatio-temporal video transformers, and virtual sets.</text>

    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="14">● CINEMATIC TECH</text>
      <text x="170" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  5 min read</text>
    </g>
  </g>
</svg>
