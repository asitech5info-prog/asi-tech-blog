<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgVision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060514" />
      <stop offset="50%" stop-color="#100c2a" />
      <stop offset="100%" stop-color="#03020b" />
    </linearGradient>
    <linearGradient id="visionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#ec4899" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.4)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)" />
    </linearGradient>
    <filter id="glowVision" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgVision)" />

  <!-- Radial Perspective Grid -->
  <g stroke="rgba(168,85,247,0.06)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- Right Visual: Spatial Computing Headset & Floating App Windows -->
  <g transform="translate(680, 110)">
    <!-- Ambient Glow -->
    <circle cx="220" cy="200" r="180" fill="#a855f7" opacity="0.12" filter="url(#glowVision)" />

    <!-- Spatial Hologram Glass Visor -->
    <path d="M 60 180 C 60 120, 160 90, 240 90 C 320 90, 420 120, 420 180 C 420 250, 340 280, 240 280 C 140 280, 60 250, 60 180 Z" fill="url(#visorGlass)" stroke="#c084fc" stroke-width="2.5" filter="url(#glowVision)" />
    
    <!-- Lenses / Micro-OLED Displays -->
    <ellipse cx="160" cy="180" rx="55" ry="40" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="185" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">4K Micro-OLED</text>

    <ellipse cx="320" cy="180" rx="55" ry="40" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="320" y="185" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">23M Pixels</text>

    <!-- Floating Spatial Window 1 (Top Right) -->
    <rect x="260" y="20" width="160" height="60" rx="12" fill="rgba(30, 27, 75, 0.8)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="280" cy="38" r="4" fill="#f43f5e" />
    <circle cx="295" cy="38" r="4" fill="#fbbf24" />
    <circle cx="310" cy="38" r="4" fill="#34d399" />
    <text x="340" y="65" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Spatial Canvas 3D</text>

    <!-- Floating Spatial Window 2 (Bottom Left) -->
    <rect x="20" y="290" width="180" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="320" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">APPLE R1 CHIP</text>
    <text x="110" y="342" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">12ms Sensor Latency</text>

    <!-- Floating Spatial Window 3 (Bottom Right) -->
    <rect x="250" y="300" width="190" height="65" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#4ade80" stroke-width="1.5" />
    <text x="345" y="328" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">FOVEATED EYE TRACK</text>
    <text x="345" y="348" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">90Hz Dynamic Real-Time</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="38" rx="19" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1.5" />
    <text x="115" y="24" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">SPATIAL COMPUTING</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Apple Vision Pro &amp;</text>
    <text x="0" y="150" fill="url(#visionGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Spatial Computing</text>
    
    <!-- Description -->
    <text x="0" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Dual 4K Micro-OLEDs, R1 real-time sensor fusion &amp; visionOS architecture.</text>

    <!-- Metadata -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">● APPLE HARDWARE</text>
      <text x="200" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  5 min read</text>
      <text x="310" y="0" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="14">|  DEEP TECH</text>
    </g>
  </g>
</svg>
