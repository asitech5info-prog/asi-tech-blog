<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="sciGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad3)" />

  <!-- Stars / Particles -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="80" r="1.5" />
    <circle cx="450" cy="120" r="2" />
    <circle cx="750" cy="90" r="1" />
    <circle cx="950" cy="180" r="2.5" />
    <circle cx="1100" cy="70" r="1.5" />
    <circle cx="280" cy="480" r="2" />
    <circle cx="680" cy="520" r="1.5" />
    <circle cx="850" cy="460" r="3" />
  </g>

  <!-- Deep Cosmos Nebula & Galaxy -->
  <circle cx="920" cy="300" r="180" fill="#10b981" opacity="0.2" filter="url(#glow3)" />
  <circle cx="800" cy="380" r="120" fill="#059669" opacity="0.25" filter="url(#glow3)" />

  <g transform="translate(720, 120)" stroke="#34d399" stroke-width="2" fill="none" opacity="0.8">
    <circle cx="200" cy="190" r="130" stroke-dasharray="8 6" />
    <circle cx="200" cy="190" r="90" stroke-dasharray="4 4" />
    <circle cx="200" cy="190" r="50" fill="#10b981" opacity="0.3" filter="url(#glow3)" />
    <circle cx="200" cy="190" r="16" fill="#ffffff" />
    <!-- Orbiting bodies -->
    <circle cx="330" cy="190" r="8" fill="#6ee7b7" />
    <circle cx="150" cy="110" r="6" fill="#a7f3d0" />
    <circle cx="200" cy="320" r="7" fill="#34d399" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
    <text x="80" y="25" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">SCIENCE &amp; SPACE</text>

    <text x="0" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Dark Matter &amp; JWST</text>
    <text x="0" y="170" fill="url(#sciGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Cosmic Breakthroughs</text>
    
    <text x="0" y="235" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18">Unveiling deep universe secrets from the edge of time.</text>

    <g transform="translate(0, 280)">
      <text x="0" y="0" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14">● ASI TECH ASTROPHYSICS</text>
      <text x="230" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  6 min read</text>
    </g>
  </g>
</svg>
