<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181005" />
      <stop offset="50%" stop-color="#241708" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad4)" />

  <!-- Abstract Road Map Graphic -->
  <g transform="translate(680, 160)">
    <circle cx="200" cy="180" r="140" fill="#f59e0b" opacity="0.1" filter="url(#glow4)" />
    
    <!-- Pathway Milestone Nodes -->
    <path d="M 60 260 Q 140 180 220 220 T 360 80" stroke="#f59e0b" stroke-width="4" fill="none" stroke-dasharray="10 6" />
    
    <circle cx="60" cy="260" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
    <text x="60" y="265" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">L1</text>
    
    <circle cx="220" cy="220" r="18" fill="#1e293b" stroke="#fbbf24" stroke-width="3" />
    <text x="220" y="225" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">SR</text>

    <circle cx="360" cy="80" r="22" fill="#f59e0b" filter="url(#glow4)" />
    <circle cx="360" cy="80" r="18" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <text x="360" y="86" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">★</text>
    
    <rect x="260" y="120" width="160" height="36" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="340" y="143" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">STAFF / ARCHITECT</text>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="80" y="25" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">EDUCATION</text>

    <text x="0" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Mastering Software</text>
    <text x="0" y="170" fill="url(#eduGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800">Engineering 2025</text>
    
    <text x="0" y="235" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18">The battle-tested roadmap from junior dev to staff architect.</text>

    <g transform="translate(0, 280)">
      <text x="0" y="0" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="14">● ASI TECH CAREER ROADMAP</text>
      <text x="250" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  4 min read</text>
    </g>
  </g>
</svg>
