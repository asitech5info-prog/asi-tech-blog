<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgBat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="batGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgBat)" />

  <g transform="translate(680, 140)">
    <circle cx="200" cy="180" r="150" fill="#10b981" opacity="0.12" filter="url(#batGlow)" />
    
    <!-- Battery Cell Outline -->
    <rect x="50" y="80" width="300" height="180" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#10b981" stroke-width="2.5" />
    <rect x="350" y="130" width="20" height="80" rx="6" fill="#10b981" />

    <!-- Charge Cells -->
    <rect x="70" y="100" width="55" height="140" rx="8" fill="#10b981" opacity="0.9" />
    <rect x="135" y="100" width="55" height="140" rx="8" fill="#10b981" opacity="0.9" />
    <rect x="200" y="100" width="55" height="140" rx="8" fill="#10b981" opacity="0.9" />
    <rect x="265" y="100" width="55" height="140" rx="8" fill="#06b6d4" opacity="0.9" />

    <text x="200" y="300" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">1000 Wh/L DENSITY • 800V</text>
  </g>

  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="220" height="40" rx="20" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="1.5" />
    <text x="110" y="25" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">CLEAN TECH &amp; EV</text>

    <text x="0" y="105" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">Solid-State Batteries</text>
    <text x="0" y="160" fill="url(#batGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800">&amp; 800V EV Revolution</text>
    
    <text x="0" y="225" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">10-minute ultrafast charging and 1,000km range unlocked.</text>

    <g transform="translate(0, 275)">
      <text x="0" y="0" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14">● ENERGY TECH</text>
      <text x="140" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">|  4 min read</text>
    </g>
  </g>
</svg>
